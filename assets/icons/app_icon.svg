<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo escuro da marca -->
  <rect width="1024" height="1024" fill="#111111"/>

  <!-- Raios de luz saindo do bulbo -->
  <g stroke="#F5A623" stroke-width="34" stroke-linecap="round">
    <line x1="512" y1="120" x2="512" y2="220"/>
    <line x1="245" y1="230" x2="316" y2="301"/>
    <line x1="779" y1="230" x2="708" y2="301"/>
    <line x1="150" y1="470" x2="250" y2="470"/>
    <line x1="874" y1="470" x2="774" y2="470"/>
  </g>

  <!-- Bulbo da lampada -->
  <circle cx="512" cy="470" r="190" fill="#FFE4B5"/>
  <circle cx="512" cy="470" r="190" fill="none" stroke="#F5A623" stroke-width="20"/>

  <!-- Filamento estilizado -->
  <path d="M 452 470 Q 482 410 512 470 Q 542 530 572 470"
        fill="none" stroke="#C47D0E" stroke-width="22" stroke-linecap="round"/>

  <!-- Rosca / base da lampada -->
  <rect x="437" y="648" width="150" height="40" rx="14" fill="#F5A623"/>
  <rect x="452" y="694" width="120" height="34" rx="12" fill="#C47D0E"/>
  <rect x="470" y="734" width="84" height="40" rx="14" fill="#8A6A1A"/>

  <!-- Inicial da marca embaixo -->
  <text x="512" y="900" font-family="Georgia, 'Times New Roman', serif"
        font-size="150" font-weight="bold" fill="#F5A623"
        text-anchor="middle">R</text>
</svg>
